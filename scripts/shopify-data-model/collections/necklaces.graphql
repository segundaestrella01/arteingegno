# Collection: Necklaces
#
# Manual collection for the Necklaces product category.
# Tagged with `category-showcase` so the category-showcase section
# on the homepage picks it up automatically.
#
# Handle: necklaces
# Run: once against the production store (mattiastore-3117.myshopify.com).

mutation CreateNecklacesCollection($input: CollectionInput!) {
  collectionCreate(input: $input) {
    collection {
      id
      title
      handle
    }
    userErrors {
      field
      message
    }
  }
}

# Variables:
# {
#   "input": {
#     "title": "Necklaces",
#     "handle": "necklaces",
#     "tags": ["category-showcase"]
#   }
# }
